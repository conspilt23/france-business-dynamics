# Source de vérité des dépendances DIRECTES (versions exactes).
# requirements.txt est dérivé de ce fichier (un test vérifie la cohérence).
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "france-business-dynamics"
version = "0.3.2"
description = "Analyse du tissu économique français à partir des données ouvertes SIRENE de l'Insee (Python, Polars, Parquet, SQL Server, Power BI)."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harvey Ureña" }]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "polars==1.44.2",
    "pyarrow==25.0.1",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "pyodbc==5.3.0",
    "python-dotenv==1.2.4",
    "fsspec==2026.9.0",
    "aiohttp==3.14.3",
]

[project.optional-dependencies]
notebooks = [
    "jupyter==1.1.1",
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
]
dev = [
    "pytest==9.1.1",
    "sqlglot==30.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Aucun `pythonpath` ni `sys.path` : le paquet doit être installé (pip install -e .).
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "layer(name): couche de test (A-unit, B-sources, C-schema, D-geography, E-transformation, F-quality, G-sql, H-artifacts, I-integration)",
    "integration: test d'intégration local (serveur HTTP local, SQLite) — aucun accès réseau externe",
]
